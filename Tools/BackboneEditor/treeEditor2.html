<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Relic Keeper — каркас дерева</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2a2a2a; color: #eee; font: 14px Segoe UI, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; background: #1e1e1e; border-bottom: 1px solid #444; }
  button, label.file { background: #3a3a3a; color: #eee; border: 1px solid #666; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button:hover, label.file:hover { background: #4a4a4a; }
  button:disabled { opacity: 0.4; cursor: default; }
  label.file input { display: none; }
  .spacer { flex: 1; }
  #hint { color: #bbb; font-size: 12px; }
  canvas { flex: 1; min-width: 0; height: 100%; display: block; }
  #workspace { flex: 1; display: flex; min-height: 0; }
  #inspector { width: 320px; overflow: auto; background: #242424; border-left: 1px solid #444; padding: 12px; }
  #inspector h2 { margin: 0 0 8px; font-size: 15px; }
  #inspector h3 { margin: 12px 0 6px; font-size: 13px; color: #ddd; }
  #inspector label { display: block; margin: 8px 0 2px; color: #aaa; font-size: 12px; }
  #inspector input, #inspector select { width: 100%; background: #333; color: #eee; border: 1px solid #555; padding: 4px 6px; }
  #inspector .row { display: flex; gap: 8px; }
  #inspector .row > div { flex: 1; }
  #inspector .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  #inspector .check input { width: auto; }
  #inspector button { width: 100%; margin-top: 6px; }
  #inspector .conn { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
  #inspector .conn span { flex: 1; font-size: 12px; }
  #inspector .conn button { width: auto; margin: 0; padding: 4px 6px; }
  #inspector .help { color: #9ab; font-size: 12px; line-height: 1.45; }
  canvas.grabbing { cursor: grabbing; }
  #menu { position: fixed; z-index: 5; display: none; min-width: 240px; padding: 4px 0; background: #2c2c2c; border: 1px solid #777; box-shadow: 0 10px 28px #000a; }
  #menu button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 0; }
  #menu button:hover:not(:disabled) { background: #505050; }
  #menu hr { border: 0; border-top: 1px solid #555; margin: 4px 0; }
</style>
</head>
<body>
<header>
  <button id="backbone">Каркас</button>
  <button id="undo" disabled>Отмена</button>
  <label><input id="snap" type="checkbox" checked> Сетка</label>
  <span class="spacer"></span>
  <label class="file">Открыть<input id="open" type="file" accept="application/json,.json"></label>
  <button id="save">Сохранить</button>
  <span id="hint">ЛКМ — рамка. Масштаб выделения — в инспекторе. ПКМ — меню</span>
</header>
<div id="workspace">
<canvas id="view"></canvas>
<aside id="inspector"></aside>
</div>
<div id="menu"></div>
<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const R = { start: 20, small: 14, notable: 20, keystone: 26 };
const COL = { start: "#328c32", small: "#d7d7d7", notable: "#28505a", keystone: "#784614" };
const COLORS = ["rgba(120,140,190,0.35)", "rgba(180,120,70,0.35)", "rgba(80,150,120,0.35)", "rgba(150,90,150,0.35)"];

let nodes = [];
let clusters = [];
let curves = [];
let nextId = 1;
let selected = [];
let selectedClusters = [];
let selectedCluster = null;
let selectedOrbit = -1;
let selectedCurve = null;
let cam = { x: 0, y: 0, z: 1 };
let drag = null;
let pan = null;
let marquee = null;
let space = false;
let undo = [];
let snap = true;
let scaleSession = null;

function uid(prefix) { return prefix + (nextId++); }
function nodeById(id) { return nodes.find(n => n.id === id); }
function clusterById(id) { return clusters.find(c => c.id === id); }
function isSel(n) { return selected.includes(n); }

function snapshot() { return JSON.stringify({ nodes, clusters, curves, nextId }); }
function pushUndo() {
  undo.push(snapshot());
  if (undo.length > 60) undo.shift();
  document.getElementById("undo").disabled = false;
}
function restore() {
  if (!undo.length) return;
  const data = JSON.parse(undo.pop());
  nodes = data.nodes; clusters = data.clusters; curves = data.curves; nextId = data.nextId;
  selected = []; selectedClusters = []; selectedCluster = null; selectedCurve = null;
  document.getElementById("undo").disabled = undo.length === 0;
  hideMenu();
  draw();
}

function polar(r, deg) {
  const a = deg * Math.PI / 180;
  return { x: Math.cos(a) * r, y: Math.sin(a) * r };
}
function pos(n) {
  if (!n.cluster) return { x: n.x, y: n.y };
  const c = clusterById(n.cluster);
  if (!c) return { x: n.x, y: n.y };
  const radius = c.orbits[n.orbit] ?? c.orbits[0];
  const p = polar(radius, n.angle);
  return { x: c.x + p.x, y: c.y + p.y };
}
function angleOf(center, p) {
  let a = Math.atan2(p.y - center.y, p.x - center.x) * 180 / Math.PI;
  return a < 0 ? a + 360 : a;
}
function link(a, b) {
  if (!a || !b || a === b) return;
  if (!a.links.includes(b.id)) a.links.push(b.id);
  if (!b.links.includes(a.id)) b.links.push(a.id);
}
function unlink(a, b) {
  a.links = a.links.filter(id => id !== b.id);
  b.links = b.links.filter(id => id !== a.id);
  curves = curves.filter(c => !((c.a === a.id && c.b === b.id) || (c.a === b.id && c.b === a.id)));
}
function curveOf(a, b) {
  return curves.find(c => (c.a === a.id && c.b === b.id) || (c.a === b.id && c.b === a.id));
}
function makeNode(type, x, y, extra) {
  return Object.assign({ id: uid("n"), type, x, y, links: [], cluster: "", orbit: 0, angle: 0, backbone: false }, extra);
}
function snapPoint(p) {
  if (!snap) return p;
  return { x: Math.round(p.x / 20) * 20, y: Math.round(p.y / 20) * 20 };
}

function generateBackbone() {
  if (nodes.length && !confirm("Заменить текущий каркас новым? Кластеры тоже сотрутся.")) return;
  if (nodes.length) pushUndo();
  nodes = []; clusters = []; curves = []; nextId = 1;
  const start = makeNode("start", 0, 0, { id: "start", backbone: true });
  nodes.push(start);
  const ring = [];
  for (let i = 0; i < 8; i++) {
    const p = polar(500, i * 45);
    const n = makeNode("small", p.x, p.y, { backbone: true });
    nodes.push(n);
    ring.push(n);
  }
  for (let i = 0; i < 8; i++) link(ring[i], ring[(i + 1) % 8]);
  for (let i = 0; i < 4; i++) {
    const inner = polar(180, 45 + i * 90);
    const outer = polar(320, 45 + i * 90);
    const a = makeNode("small", inner.x, inner.y, { backbone: true });
    const b = makeNode("small", outer.x, outer.y, { backbone: true });
    nodes.push(a, b);
    link(start, a); link(a, b); link(b, ring[i * 2 + 1]);
  }
  selected = []; selectedClusters = []; selectedCluster = null; selectedCurve = null;
  draw();
}

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  draw();
}
function toScreen(p) {
  return { x: (p.x - cam.x) * cam.z + canvas.width / 2, y: (p.y - cam.y) * cam.z + canvas.height / 2 };
}
function toWorld(sx, sy) {
  return { x: (sx - canvas.width / 2) / cam.z + cam.x, y: (sy - canvas.height / 2) / cam.z + cam.y };
}
function pointer(ev) {
  const rect = canvas.getBoundingClientRect();
  return { x: (ev.clientX - rect.left) * devicePixelRatio, y: (ev.clientY - rect.top) * devicePixelRatio };
}

function cubic(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
  };
}
function curveGeometry(curve) {
  const a = nodeById(curve.a), b = nodeById(curve.b);
  if (!a || !b) return null;
  const pa = pos(a), pb = pos(b);
  const anchor = { x: pa.x + (pb.x - pa.x) * curve.anchor / 100, y: pa.y + (pb.y - pa.y) * curve.anchor / 100 };
  return { a, b, pa, pb, anchor, c1: { x: anchor.x + curve.inX, y: anchor.y + curve.inY }, c2: { x: anchor.x + curve.outX, y: anchor.y + curve.outY } };
}
function lerp2(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
function splitCubic(p0, p1, p2, p3, t) {
  const q0 = lerp2(p0, p1, t), q1 = lerp2(p1, p2, t), q2 = lerp2(p2, p3, t);
  const r0 = lerp2(q0, q1, t), r1 = lerp2(q1, q2, t), s = lerp2(r0, r1, t);
  return { left: [p0, q0, r0, s], right: [s, r1, q2, p3] };
}
function curveSpans(curve) {
  const g = curveGeometry(curve);
  if (!g) return [];
  if (!curve.span) return [{ p0: g.pa, c1: g.c1, c2: g.c2, p3: g.pb }];
  const knots = curve.knots || [];
  const spans = [];
  let start = g.pa;
  let out = { x: curve.startOutX || 0, y: curve.startOutY || 0 };
  knots.forEach(knot => {
    const end = { x: knot.x, y: knot.y };
    spans.push({
      p0: start,
      c1: { x: start.x + out.x, y: start.y + out.y },
      c2: { x: end.x + (knot.inX || 0), y: end.y + (knot.inY || 0) },
      p3: end
    });
    start = end;
    out = { x: knot.outX || 0, y: knot.outY || 0 };
  });
  spans.push({
    p0: start,
    c1: { x: start.x + out.x, y: start.y + out.y },
    c2: { x: g.pb.x + (curve.endInX || 0), y: g.pb.y + (curve.endInY || 0) },
    p3: g.pb
  });
  return spans;
}
function closestOnCubic(p0, p1, p2, p3, point) {
  let best = { t: 0, d: Math.hypot(point.x - p0.x, point.y - p0.y) };
  let prev = p0, prevT = 0;
  for (let i = 1; i <= 32; i++) {
    const t = i / 32;
    const cur = cubic(p0, p1, p2, p3, t);
    const abx = cur.x - prev.x, aby = cur.y - prev.y;
    const len = abx * abx + aby * aby;
    const seg = len < 0.0001 ? 0 : Math.max(0, Math.min(1, ((point.x - prev.x) * abx + (point.y - prev.y) * aby) / len));
    const px = prev.x + abx * seg, py = prev.y + aby * seg;
    const d = Math.hypot(point.x - px, point.y - py);
    if (d < best.d) best = { t: prevT + (t - prevT) * seg, d };
    prev = cur;
    prevT = t;
  }
  return best;
}
function insertKnot(curve, world) {
  const spans = curveSpans(curve);
  let best = null;
  spans.forEach((span, index) => {
    const hit = closestOnCubic(span.p0, span.c1, span.c2, span.p3, world);
    if (!best || hit.d < best.d) best = { d: hit.d, t: hit.t, index, span };
  });
  if (!best || best.d > 12 || best.t < 0.06 || best.t > 0.94) return false;
  const parts = splitCubic(best.span.p0, best.span.c1, best.span.c2, best.span.p3, best.t);
  const s = parts.left[3];
  const knot = {
    x: s.x, y: s.y,
    inX: parts.left[2].x - s.x, inY: parts.left[2].y - s.y,
    outX: parts.right[1].x - s.x, outY: parts.right[1].y - s.y,
    mirror: true
  };
  if (!curve.span) {
    curve.span = true;
    curve.startOutX = parts.left[1].x - parts.left[0].x;
    curve.startOutY = parts.left[1].y - parts.left[0].y;
    curve.endInX = parts.right[2].x - parts.right[3].x;
    curve.endInY = parts.right[2].y - parts.right[3].y;
    curve.knots = [knot];
    selectedKnot = 0;
    return true;
  }
  curve.knots = curve.knots || [];
  if (best.index === 0) {
    curve.startOutX = parts.left[1].x - parts.left[0].x;
    curve.startOutY = parts.left[1].y - parts.left[0].y;
  } else {
    curve.knots[best.index - 1].outX = parts.left[1].x - parts.left[0].x;
    curve.knots[best.index - 1].outY = parts.left[1].y - parts.left[0].y;
  }
  if (best.index >= curve.knots.length) {
    curve.endInX = parts.right[2].x - parts.right[3].x;
    curve.endInY = parts.right[2].y - parts.right[3].y;
  } else {
    curve.knots[best.index].inX = parts.right[2].x - parts.right[3].x;
    curve.knots[best.index].inY = parts.right[2].y - parts.right[3].y;
  }
  curve.knots.splice(best.index, 0, knot);
  selectedKnot = best.index;
  return true;
}
function removeSelectedKnot() {
  if (!selectedCurve || !selectedCurve.knots || selectedKnot < 0 || selectedKnot >= selectedCurve.knots.length) return;
  pushUndo();
  selectedCurve.knots.splice(selectedKnot, 1);
  selectedKnot = -1;
  draw();
}
let selectedKnot = -1;
function sameOrbit(a, b) {
  return a.cluster && a.cluster === b.cluster && a.orbit === b.orbit && clusterById(a.cluster);
}
function shortSweep(a0, a1) {
  let s = (a1 - a0) % 360;
  if (s < 0) s += 360;
  if (s > 180) return { a: a1, s: 360 - s };
  return { a: a0, s };
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#3a3a3a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const g = 20 * cam.z;
  if (g > 8) {
    ctx.strokeStyle = "rgba(255,255,255,0.045)";
    ctx.lineWidth = 1;
    const origin = toScreen({ x: 0, y: 0 });
    ctx.beginPath();
    for (let x = origin.x % g; x < canvas.width; x += g) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
    for (let y = origin.y % g; y < canvas.height; y += g) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
    ctx.stroke();
  }
  clusters.forEach((c, i) => {
    const s = toScreen(c);
    c.orbits.forEach(radius => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, radius * cam.z, 0, Math.PI * 2);
      ctx.strokeStyle = c === selectedCluster || selectedClusters.includes(c) ? "rgba(230,190,60,0.9)" : COLORS[i % COLORS.length];
      ctx.lineWidth = c === selectedCluster || selectedClusters.includes(c) ? 2 : 1;
      ctx.stroke();
    });
    ctx.beginPath();
    ctx.arc(s.x, s.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = c === selectedCluster || selectedClusters.includes(c) ? "#e6be3c" : "#9ab";
    ctx.fill();
  });
  const seen = new Set();
  nodes.forEach(n => n.links.forEach(id => {
    const key = n.id < id ? n.id + "|" + id : id + "|" + n.id;
    if (seen.has(key)) return;
    seen.add(key);
    const other = nodeById(id);
    if (!other) return;
    const curve = curveOf(n, other);
    ctx.strokeStyle = curve === selectedCurve ? "#fff" : "#e6be3c";
    ctx.lineWidth = Math.max(2, 3 * cam.z);
    ctx.beginPath();
    if (curve) {
      const spans = curveSpans(curve);
      if (!spans.length) return;
      spans.forEach(span => {
        ctx.moveTo(toScreen(span.p0).x, toScreen(span.p0).y);
        for (let t = 1; t <= 16; t++) {
          const p = toScreen(cubic(span.p0, span.c1, span.c2, span.p3, t / 16));
          ctx.lineTo(p.x, p.y);
        }
      });
    } else if (sameOrbit(n, other)) {
      const c = clusterById(n.cluster);
      const radius = c.orbits[n.orbit];
      const sw = shortSweep(n.angle, other.angle);
      if (sw.s < 170) {
        for (let i = 0; i <= 16; i++) {
          const p = toScreen({ x: c.x + Math.cos((sw.a + sw.s * i / 16) * Math.PI / 180) * radius, y: c.y + Math.sin((sw.a + sw.s * i / 16) * Math.PI / 180) * radius });
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
      } else {
        const a = toScreen(pos(n)), b = toScreen(pos(other));
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      }
    } else {
      const a = toScreen(pos(n)), b = toScreen(pos(other));
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
  }));
  if (selectedCurve) {
    const g = curveGeometry(selectedCurve);
    if (g && selectedCurve.span) {
      ctx.strokeStyle = "#7ec8ff";
      ctx.lineWidth = 1;
      const drawWhisker = (from, to) => {
        const a = toScreen(from), b = toScreen(to);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fillStyle = "#7ec8ff"; ctx.fill();
      };
      drawWhisker(g.pa, { x: g.pa.x + (selectedCurve.startOutX || 0), y: g.pa.y + (selectedCurve.startOutY || 0) });
      (selectedCurve.knots || []).forEach((knot, index) => {
        const at = { x: knot.x, y: knot.y };
        drawWhisker(at, { x: at.x + (knot.inX || 0), y: at.y + (knot.inY || 0) });
        drawWhisker(at, { x: at.x + (knot.outX || 0), y: at.y + (knot.outY || 0) });
        const s = toScreen(at);
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = index === selectedKnot ? "#fff" : "#e6be3c";
        ctx.fillRect(-5, -5, 10, 10);
        ctx.restore();
      });
      drawWhisker(g.pb, { x: g.pb.x + (selectedCurve.endInX || 0), y: g.pb.y + (selectedCurve.endInY || 0) });
    } else if (g) {
      ctx.strokeStyle = "#7ec8ff";
      ctx.lineWidth = 1;
      [[g.c1, g.anchor], [g.c2, g.anchor]].forEach(([h, a]) => {
        const hs = toScreen(h), as = toScreen(a);
        ctx.beginPath(); ctx.moveTo(hs.x, hs.y); ctx.lineTo(as.x, as.y); ctx.stroke();
        ctx.beginPath(); ctx.arc(hs.x, hs.y, 6, 0, Math.PI * 2); ctx.fillStyle = "#7ec8ff"; ctx.fill();
      });
      const as = toScreen(g.anchor);
      ctx.save();
      ctx.translate(as.x, as.y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = "#e6be3c";
      ctx.fillRect(-5, -5, 10, 10);
      ctx.restore();
    }
  }
  if (selectedCluster) {
    const s = toScreen(selectedCluster);
    selectedCluster.orbits.forEach(radius => {
      const h = toScreen({ x: selectedCluster.x + radius, y: selectedCluster.y });
      ctx.beginPath(); ctx.arc(h.x, h.y, 6, 0, Math.PI * 2); ctx.fillStyle = "#e6be3c"; ctx.fill();
    });
    ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI * 2); ctx.strokeStyle = "#fff"; ctx.stroke();
  }
  nodes.forEach(n => {
    const s = toScreen(pos(n));
    const r = R[n.type] * cam.z;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fillStyle = COL[n.type];
    ctx.fill();
    ctx.lineWidth = isSel(n) ? 4 : 3;
    ctx.strokeStyle = "#fff";
    ctx.stroke();
  });
  if (marquee && marquee.moved) {
    const x = Math.min(marquee.x0, marquee.x1);
    const y = Math.min(marquee.y0, marquee.y1);
    const w = Math.abs(marquee.x1 - marquee.x0);
    const h = Math.abs(marquee.y1 - marquee.y0);
    ctx.fillStyle = "rgba(140,190,255,0.16)";
    ctx.strokeStyle = "#9cf";
    ctx.lineWidth = 1;
    ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);
  }
  syncInspector();
}

function hitNode(sx, sy) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const s = toScreen(pos(nodes[i]));
    const r = R[nodes[i].type] * cam.z + 4;
    if ((s.x - sx) ** 2 + (s.y - sy) ** 2 <= r * r) return nodes[i];
  }
  return null;
}
function hitHandle(sx, sy) {
  if (selectedCurve) {
    const g = curveGeometry(selectedCurve);
    if (g && selectedCurve.span) {
      const hits = [[{ x: g.pa.x + (selectedCurve.startOutX || 0), y: g.pa.y + (selectedCurve.startOutY || 0) }, "out", -1]];
      (selectedCurve.knots || []).forEach((knot, index) => {
        const at = { x: knot.x, y: knot.y };
        hits.push([at, "anchor", index]);
        hits.push([{ x: at.x + (knot.inX || 0), y: at.y + (knot.inY || 0) }, "in", index]);
        hits.push([{ x: at.x + (knot.outX || 0), y: at.y + (knot.outY || 0) }, "out", index]);
      });
      hits.push([{ x: g.pb.x + (selectedCurve.endInX || 0), y: g.pb.y + (selectedCurve.endInY || 0) }, "in", -2]);
      for (const [p, name, knot] of hits) {
        const s = toScreen(p);
        const hit = name === "anchor" ? 12 : 10;
        if (Math.abs(s.x - sx) <= hit && Math.abs(s.y - sy) <= hit) return { kind: "bezier", name, knot };
      }

function defaultCurve(a, b) {

canvas.addEventListener("contextmenu", ev => {

  } else if (clusterHit) {

    selected = []; selectedCurve = null;

canvas.addEventListener("pointermove", ev => {
  rememberCursor(ev);

    cam.y = pan.y - (p.y - pan.sy) / cam.z;
    draw();
    return;
  }
  if (marquee) {
    marquee.x1 = p.x;
    marquee.y1 = p.y;
    if (Math.hypot(marquee.x1 - marquee.x0, marquee.y1 - marquee.y0) > 4) marquee.moved = true;
    draw();
    return;
  }
  if (!drag) return;
  const world = toWorld(p.x, p.y);
  if (!drag.moved) { pushUndo(); drag.moved = true; }
  if (drag.kind === "group") {
    applyGroupDrag(world);
  } else if (drag.kind === "node") {
    const target = snapPoint({ x: world.x + drag.dx, y: world.y + drag.dy });
    const delta = { x: target.x - drag.startX, y: target.y - drag.startY };
    drag.group.forEach(item => {
      const p = snapPoint({ x: item.x + delta.x, y: item.y + delta.y });
      item.n.x = p.x;
      item.n.y = p.y;
    });
  } else if (drag.kind === "orbit") {
    const c = clusterById(drag.node.cluster);
    if (c) {
      let angle = angleOf(c, world);
      if (ev.shiftKey) angle = Math.round(angle / 15) * 15;
      drag.node.angle = (angle + 360) % 360;
    }
    const w = pos(drag.node); drag.node.x = w.x; drag.node.y = w.y;
  } else if (drag.kind === "cluster") {
    const target = snapPoint({ x: world.x + drag.dx, y: world.y + drag.dy });
    drag.cluster.x = target.x; drag.cluster.y = target.y;
  } else if (drag.kind === "radius") {
    const c = selectedCluster;
    let radius = Math.max(30, Math.hypot(world.x - c.x, world.y - c.y));
    if (ev.shiftKey) radius = Math.round(radius / 10) * 10;
    c.orbits[drag.index] = radius;

function endPointer() {

      selectedCurve = null;

    }

canvas.addEventListener("wheel", ev => {

  const after = toWorld(p.x, p.y);
  cam.x += before.x - after.x;
  cam.y += before.y - after.y;
  draw();

    item.curve.inY = item.inY * factor;
    item.curve.outX = item.outX * factor;
    item.curve.outY = item.outY * factor;
  });
}
function applyScaleInput(raw) {
  const factor = parseFloat(String(raw).replace(",", "."));
  if (!(factor > 0) || groupSize() < 2) return;
  if (!scaleSession) {
    pushUndo();
    scaleSession = captureScaleBasis();
  }
  applyScale(scaleSession, factor / 100);
  draw();
}

function cloneCurve(curve, idA, idB, dx = 0, dy = 0) {
  return {
    a: idA, b: idB, anchor: curve.anchor, inX: curve.inX, inY: curve.inY, outX: curve.outX, outY: curve.outY, mirror: !!curve.mirror,
    span: !!curve.span, startOutX: curve.startOutX || 0, startOutY: curve.startOutY || 0, endInX: curve.endInX || 0, endInY: curve.endInY || 0,
    knots: (curve.knots || []).map(k => ({ x: k.x + dx, y: k.y + dy, inX: k.inX, inY: k.inY, outX: k.outX, outY: k.outY, mirror: k.mirror !== false }))
  };
}
let clipboard = null;
let cursorWorld = null;
function rememberCursor(ev) {
  const p = pointer(ev);
  cursorWorld = toWorld(p.x, p.y);
}
function copySelection() {
  const explicit = new Set(selectedClusters.map(c => c.id));
  if (selectedCluster) explicit.add(selectedCluster.id);
  const nodeMap = new Map();
  selected.forEach(n => { if (n && n.type !== "start") nodeMap.set(n.id, n); });
  explicit.forEach(id => nodes.forEach(n => { if (n.cluster === id && n.type !== "start") nodeMap.set(n.id, n); }));
  const clusterMap = new Map();
  explicit.forEach(id => { const cluster = clusterById(id); if (cluster) clusterMap.set(id, cluster); });
  nodeMap.forEach(n => {
    if (!n.cluster) return;
    const cluster = clusterById(n.cluster);
    if (cluster) clusterMap.set(cluster.id, cluster);
  });
  if (!nodeMap.size && !clusterMap.size) return;
  const ids = new Set(nodeMap.keys());
  clipboard = {
    pasteIndex: 0,
    nodes: [...nodeMap.values()].map(n => ({
      id: n.id, type: n.type, x: pos(n).x, y: pos(n).y, cluster: n.cluster || "", orbit: n.orbit || 0, angle: n.angle || 0,
      links: (n.links || []).filter(id => ids.has(id))
    })),
    clusters: [...clusterMap.values()].map(c => ({ id: c.id, name: c.name, x: c.x, y: c.y, orbits: c.orbits.slice() })),
    curves: curves.filter(c => ids.has(c.a) && ids.has(c.b)).map(c => cloneCurve(c, c.a, c.b))
  };
}
function pasteSelection() {
  if (!clipboard || (!clipboard.nodes.length && !clipboard.clusters.length)) return;
  const anchor = cursorWorld || toWorld(canvas.width / 2, canvas.height / 2);
  const points = clipboard.nodes.map(n => ({ x: n.x, y: n.y })).concat(clipboard.clusters.map(c => ({ x: c.x, y: c.y })));
  const center = points.reduce((sum, p) => ({ x: sum.x + p.x, y: sum.y + p.y }), { x: 0, y: 0 });
  center.x /= points.length;
  center.y /= points.length;
  const dx = anchor.x - center.x;
  const dy = anchor.y - center.y;
  pushUndo();
  const idMap = {};
  const newClusters = [];
  const newNodes = [];
  clipboard.clusters.forEach(c => {
    const copy = { id: uid("c"), name: c.name, x: c.x + dx, y: c.y + dy, orbits: c.orbits.slice() };
    idMap[c.id] = copy.id;
    clusters.push(copy);
    newClusters.push(copy);
  });
  clipboard.nodes.forEach(n => {
    const cluster = n.cluster && idMap[n.cluster] ? idMap[n.cluster] : "";
    const copy = makeNode(n.type === "start" ? "small" : n.type, n.x + dx, n.y + dy, {
      cluster, orbit: cluster ? n.orbit : 0, angle: cluster ? n.angle : 0, backbone: false, links: []
    });
    if (cluster) {
      const placed = pos(copy);
      copy.x = placed.x;
      copy.y = placed.y;
    }
    idMap[n.id] = copy.id;
    nodes.push(copy);
    newNodes.push(copy);
  });
  clipboard.nodes.forEach(n => {
    const copy = nodeById(idMap[n.id]);
    (n.links || []).forEach(id => { if (idMap[id]) link(copy, nodeById(idMap[id])); });
  });
  clipboard.curves.forEach(c => {
    if (!idMap[c.a] || !idMap[c.b]) return;
    curves.push(cloneCurve(c, idMap[c.a], idMap[c.b], dx, dy));
  });
  selected = newNodes;
  selectedClusters = newClusters;
  selectedCluster = newClusters.length === 1 && !newNodes.length ? newClusters[0] : null;
  selectedCurve = null;
  selectedKnot = -1;
  clearScaleSession();
  inspectorKey = "";
  draw();
}

document.getElementById("backbone").onclick = generateBackbone;
document.getElementById("undo").onclick = restore;
document.getElementById("snap").onchange = ev => { snap = ev.target.checked; };
document.getElementById("save").onclick = exportFile;
document.getElementById("open").onchange = ev => {
  const file = ev.target.files[0];
  if (!file) return;
  file.text().then(importText).catch(err => alert(err.message || "Не удалось открыть файл"));
  ev.target.value = "";
};
function isTextField(target) {
  if (!target) return false;
  const tag = target.tagName;
  if (tag === "TEXTAREA" || tag === "SELECT") return true;
  return tag === "INPUT" && target.type !== "range" && target.type !== "checkbox";
}
window.addEventListener("keydown", ev => {
  if (isTextField(ev.target)) {
    if (ev.key === "Escape") ev.target.blur();
    return;
  }
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.code === "KeyC") { ev.preventDefault(); copySelection(); return; }
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.code === "KeyV") { ev.preventDefault(); pasteSelection(); return; }
  if (ev.code === "Space") { space = true; ev.preventDefault(); }
  if (ev.key === "Escape") { selected = []; selectedClusters = []; selectedCluster = null; selectedCurve = null; clearScaleSession(); hideMenu(); draw(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && (ev.key === "H" || ev.key === "h")) { ev.preventDefault(); mirrorSelection(true); }
  if ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && (ev.key === "V" || ev.key === "v")) { ev.preventDefault(); mirrorSelection(false); }
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.key === "z") { ev.preventDefault(); restore(); }
  if ((ev.ctrlKey || ev.metaKey) && ev.key === "s") { ev.preventDefault(); exportFile(); }
  if (selectedCurve && !ev.ctrlKey && !ev.metaKey) {
    if (ev.key === "m" || ev.key === "M") { ev.preventDefault(); flipCurve(selectedCurve); }
    if (ev.key === "l" || ev.key === "L") { ev.preventDefault(); pushUndo(); selectedCurve.mirror = !selectedCurve.mirror; if (selectedCurve.mirror) { selectedCurve.outX = -selectedCurve.inX; selectedCurve.outY = -selectedCurve.inY; } inspectorKey = ""; draw(); }
    if (ev.key === "r" || ev.key === "R") { ev.preventDefault(); resetCurve(selectedCurve); }
    if (ev.key === "[" || ev.key === "]") { ev.preventDefault(); rotateHandles(selectedCurve, (ev.key === "]" ? 1 : -1) * (ev.shiftKey ? 45 : 15)); }
  }
  if (ev.key === "Delete" || ev.key === "Backspace") {
    if (selectedCurve && selectedKnot >= 0) { ev.preventDefault(); removeSelectedKnot(); return; }
    ev.preventDefault();
    deleteSelection();
  }
});
window.addEventListener("keyup", ev => { if (ev.code === "Space") space = false; });
window.addEventListener("resize", resize);
generateBackbone();
resize();
</script>
